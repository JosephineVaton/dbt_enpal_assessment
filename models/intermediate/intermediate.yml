version: 2

models:
  - name: int_stage_transitions
    description: >
      Journal des transitions de stage pour chaque deal.
      Chaque ligne représente un passage d’un deal à une nouvelle étape du pipeline Pipedrive.
    columns:
      - name: deal_id
        description: "Identifiant unique du deal."
      - name: change_time
        description: "Date et heure du changement de stage."
      - name: stage_id
        description: "Identifiant numérique du nouveau stage."
      - name: stage_name
        description: "Nom lisible du stage (ex: 'Negotiation')."

  - name: int_activity_events
    description: >
      Journal des activités liées aux deals (appels, e-mails, réunions, etc.).
      Chaque ligne représente une action commerciale enregistrée dans Pipedrive.
    columns:
      - name: deal_id
        description: "Identifiant du deal concerné."
      - name: activity_date
        description: "Date de l’activité planifiée."
      - name: activity_type_name
        description: "Nom du type d’activité (Sales Call, Follow-up...)."
      - name: activity_type_key
        description: "Clé technique du type d’activité."
      - name: is_completed
        description: "Indique si l’activité a été réalisée (true/false)."
